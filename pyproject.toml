[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "game-explorer"
version = "0.1.0"
description = "Evidence-first software exploration for authorized QA"
requires-python = ">=3.12"
dependencies = ["playwright>=1.58,<2", "pydantic>=2.10,<3", "PyYAML>=6,<7", "typer>=0.15,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<3", "types-PyYAML>=6,<7"]

[project.scripts]
game-explorer = "game_explorer.cli.app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: launches a real local Chromium instance"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/game_explorer"]
